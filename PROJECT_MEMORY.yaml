# ─── ACTIVE ARCHITECTURE ──────────────────────────────────────────
architecture:
  active_variant: V6_Dual_Stream_Ensemble  # DeepTrace Macro + Microscopic Residual
  config: configs/model_config.yaml
  trained_modules:
    spatial_encoder:    {backbone: efficientnet_b0, output_dim: 128, unfrozen_stages: [5, 6, 7], lr: 3e-5}
    frequency_encoder:  {backbone: efficientnet_b0_dct, output_dim: 128, unfrozen_stages: [5, 6, 7], lr: 3e-5}
    srm_residual_stream:{backbone: 3ch_srm_laplacian_filters, output_dim: 128, lr: 3e-5}
    clip_projection:    {backbone: openclip_vit_b32, output_dim: 512, lr: 5e-6}
    multimodal_fusion:  {type: cross_attention_2L_8H, hidden_dim: 512, lr: 1e-4}
    detection_head:     {branches: [binary_logit, manipulation_5class], lr: 1e-4}
  total_params_m: 139.7
  trainable_params_m: 51.9

# ─── DATA ─────────────────────────────────────────────────────────
