paths:
  root: .
  state_file: project_state.json
  summary_file: context_summary.md
  base_config: configs/config.yaml
  model_config: configs/model_config.yaml
  model_config_v2: configs/model_config_v2.yaml
  active_checkpoint: checkpoints/kaggle_realfake/best_model.pth
  calibration_file: checkpoints/kaggle_realfake/calibration.json
